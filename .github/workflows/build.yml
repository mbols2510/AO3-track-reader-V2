name: build

on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach build outputs to this existing release tag (e.g. v2.0.0)'
        required: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # Don't attach Docker build-record files to the run's artifacts.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { target: [tracksync, tracker] }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      # Release tags publish vX.Y.Z, X.Y.Z and latest, so docker compose can follow "latest".
      - id: tags
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ao3track-${{ matrix.target }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            printf 'list<<EOF\n%s:%s\n%s:%s\n%s:latest\nEOF\n' "$img" "$GITHUB_REF_NAME" "$img" "${GITHUB_REF_NAME#v}" "$img" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            printf 'list<<EOF\n%s:main\n%s:latest\nEOF\n' "$img" "$img" >> "$GITHUB_OUTPUT"
          else
            echo "list=$img:${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  extension-and-msi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      # Runner DNS to the Ubuntu mirrors is occasionally flaky, so retry.
      - run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 wixl zip && exit 0
            echo "apt failed (attempt $i), retrying in 20s"; sleep 20
          done
          exit 1
      - run: npm ci
      - run: npm run build -w apps/extension
      - run: cd apps/reader && node build.mjs && node package-win.mjs && node make-msi.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi-and-extension
          path: |
            apps/reader/out/*.msi
            apps/extension/dist/*.zip

  msix:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: cd apps/reader; node build.mjs; node package-win.mjs
      - name: Build MSIX (signed if WINDOWS_PFX_BASE64 secret is set)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Ao3Track' }}
        run: |
          if ($env:PFX_B64) {
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
            ./apps/reader/make-msix.ps1 -PfxPath "$PWD/cert.pfx" -PfxPassword $env:PFX_PASSWORD -Publisher $env:PUBLISHER
          } else {
            ./apps/reader/make-msix.ps1 -Publisher $env:PUBLISHER
          }
      - uses: actions/upload-artifact@v4
        with: { name: windows-msix, path: apps/reader/out/*.msix }

  release:
    # Attach the installers to the GitHub release for this tag (created if missing).
    needs: [extension-and-msi, msix]
    if: always() && needs.extension-and-msi.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Only our build outputs, not the Docker build records.
          pattern: windows-*
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          files=$(find artifacts -type f \( -name '*.msi' -o -name '*.msix' -o -name '*.zip' \))
          echo "$files"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" $files -R "$GITHUB_REPOSITORY" --clobber
