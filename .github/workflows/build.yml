name: build

on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { target: [tracksync, tracker] }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ghcr.io/${{ github.repository_owner }}/ao3track-${{ matrix.target }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  extension-and-msi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y wixl zip
      - run: npm ci
      - run: npm run build -w apps/extension
      - run: cd apps/reader && node build.mjs && node package-win.mjs && node make-msi.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi-and-extension
          path: |
            apps/reader/out/*.msi
            apps/extension/dist/*.zip

  msix:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: cd apps/reader; node build.mjs; node package-win.mjs
      - name: Build MSIX (signed if WINDOWS_PFX_BASE64 secret is set)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Ao3Track' }}
        run: |
          if ($env:PFX_B64) {
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
            ./apps/reader/make-msix.ps1 -PfxPath "$PWD/cert.pfx" -PfxPassword $env:PFX_PASSWORD -Publisher $env:PUBLISHER
          } else {
            ./apps/reader/make-msix.ps1 -Publisher $env:PUBLISHER
          }
      - uses: actions/upload-artifact@v4
        with: { name: windows-msix, path: apps/reader/out/*.msix }
