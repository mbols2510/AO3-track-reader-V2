# Remote access with your own domain + HTTPS (router forwards ports 80 and 443 to this machine).
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
services:
  tracksync:
    environment:
      TRUST_PROXY: "true"
      PUBLIC_URL: https://${SYNC_DOMAIN:?Set SYNC_DOMAIN in .env}

  tracker:
    environment:
      API_KEY: ${TRACKER_API_KEY:?Set TRACKER_API_KEY in .env before exposing the tracker}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:?Set TRACKER_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [tracksync, tracker]

volumes:
  caddy-data:
  caddy-config:
